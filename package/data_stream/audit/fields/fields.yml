- name: data_stream.dataset
  type: constant_keyword
  value: amaze.audit

- name: data_stream.namespace
  type: constant_keyword
  value: default

- name: data_stream.type
  type: constant_keyword
  value: logs

- name: "@timestamp"
  type: date
  description: Timestamp of the audit event

- name: event.id
  type: keyword
  description: Unique identifier for the audit event

- name: event.action
  type: keyword
  description: Audit action recorded by AMaze

- name: event.category
  type: keyword
  description: ECS event category for the audit event

- name: event.type
  type: keyword
  description: ECS event type for the audit event

- name: event.kind
  type: keyword
  description: ECS event kind for the audit event

- name: event.created
  type: date
  description: Timestamp when the event was processed by the ingest pipeline

- name: event.module
  type: keyword
  description: Module name for the AMaze integration

- name: event.dataset
  type: keyword
  description: Dataset name for the AMaze audit data stream

- name: user.email
  type: keyword
  description: Email address of the user performing the action

- name: amaze.actor
  type: keyword
  description: Original actor email returned by the AMaze API

- name: amaze.action
  type: keyword
  description: Original audit action returned by the AMaze API