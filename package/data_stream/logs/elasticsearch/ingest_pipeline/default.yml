---
description: Pipeline for normalizing AMaze SCA log events into ECS.

processors:
  # Preserve original values in the amaze.* namespace.
  - set:
      field: amaze.src_ip
      copy_from: src_ip
      ignore_empty_value: true
  - set:
      field: amaze.threat_score
      copy_from: threat_score
      ignore_empty_value: true
  - set:
      field: amaze.country
      copy_from: country
      ignore_empty_value: true
  - set:
      field: amaze.username
      copy_from: username
      ignore_empty_value: true

  # ECS mapping.
  - rename:
      field: src_ip
      target_field: source.ip
      ignore_missing: true
  - rename:
      field: protocol
      target_field: network.protocol
      ignore_missing: true
  - rename:
      field: threat_score
      target_field: event.severity
      ignore_missing: true
  - rename:
      field: id
      target_field: event.id
      ignore_missing: true
  - rename:
      field: timestamp
      target_field: "@timestamp"
      ignore_missing: true
  - rename:
      field: username
      target_field: source.user.name
      ignore_missing: true
  - rename:
      field: country
      target_field: source.geo.country_iso_code
      ignore_missing: true

  # ECS categorization.
  - set:
      field: event.kind
      value: event
  - set:
      field: event.category
      value: [network]
  - set:
      field: event.type
      value: [connection, info]
  - set:
      field: event.module
      value: amaze
  - set:
      field: event.dataset
      value: amaze.logs
  - set:
      field: event.created
      value: "{{{_ingest.timestamp}}}"
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"

on_failure:
  - set:
      field: error.message
      value: "{{ _ingest.on_failure_message }}"