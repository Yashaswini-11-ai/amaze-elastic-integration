- name: data_stream.dataset
  type: constant_keyword
  value: amaze.logs

- name: data_stream.namespace
  type: constant_keyword
  value: default

- name: data_stream.type
  type: constant_keyword
  value: logs

- name: "@timestamp"
  type: date
  description: Timestamp when the event occurred

- name: event.id
  type: keyword
  description: Unique identifier for the log event

- name: event.action
  type: keyword
  description: Action associated with the security event

- name: event.category
  type: keyword
  description: ECS event category of the security event

- name: event.type
  type: keyword
  description: ECS event type of the security event

- name: event.kind
  type: keyword
  description: ECS event kind of the security event

- name: event.created
  type: date
  description: Timestamp when the event was processed by the ingest pipeline

- name: event.severity
  type: long
  description: Severity score associated with the event

- name: event.module
  type: keyword
  description: Module name for the AMaze integration

- name: event.dataset
  type: keyword
  description: Dataset name for the AMaze logs data stream

- name: source.ip
  type: ip
  description: Source IP address associated with the log event

- name: source.user.name
  type: keyword
  description: Username captured by the AMaze sensor

- name: source.geo.country_iso_code
  type: keyword
  description: ISO country code of the source IP

- name: network.protocol
  type: keyword
  description: Network protocol observed in the log event

- name: amaze.src_ip
  type: ip
  description: Original source IP address returned by the AMaze API

- name: amaze.threat_score
  type: long
  description: Original threat score returned by the AMaze API

- name: amaze.country
  type: keyword
  description: Original country code returned by the AMaze API

- name: amaze.username
  type: keyword
  description: Original username returned by the AMaze API