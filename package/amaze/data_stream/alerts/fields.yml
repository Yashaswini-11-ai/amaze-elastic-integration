- name: event.id
  type: keyword
  description: Unique identifier for the AMaze security event

- name: source.ip
  type: ip
  description: Source IP address associated with the detected activity

- name: destination.ip
  type: ip
  description: Destination IP address targeted during the activity

- name: network.protocol
  type: keyword
  description: Network protocol involved in the detected activity

- name: event.severity
  type: long
  description: Threat score assigned by AMaze and mapped to ECS severity

- name: threat.technique.id
  type: keyword
  description: MITRE ATT&CK technique identifier associated with the alert

- name: event.action
  type: keyword
  description: Alert title or action generated by AMaze

- name: event.outcome
  type: keyword
  description: Current status of the AMaze ticket or alert

- name: amaze.ticket_status
  type: keyword
  description: Original ticket status returned by the AMaze API

- name: amaze.threat_score
  type: long
  description: Original threat score assigned by AMaze

- name: amaze.ttp
  type: keyword
  description: Original MITRE ATT&CK technique identifier returned by AMaze

- name: amaze.title
  type: keyword
  description: Original alert title returned by the AMaze API

- name: amaze.src_ip
  type: ip
  description: Original source IP address from the AMaze event

- name: amaze.dst_ip
  type: ip
  description: Original destination IP address from the AMaze event