title: Logs

type: logs

streams:
  - input: httpjson
    title: AMaze Logs
    description: Collect AMaze log events

vars:
  - name: base_url
    type: text
    title: AMaze Base URL
    required: true

  - name: bearer_token
    type: password
    title: Bearer Token
    required: true

  - name: verify
    type: bool
    title: Verify TLS Certificates
    default: true

  - name: interval
    type: text
    title: Collection Interval
    default: 5m