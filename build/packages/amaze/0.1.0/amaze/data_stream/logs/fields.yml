- name: source.ip
  type: ip
  description: Source IP address associated with the log event

- name: network.protocol
  type: keyword
  description: Network protocol observed in the log event

- name: "@timestamp"
  type: date
  description: Timestamp when the event occurred

- name: event.category
  type: keyword
  description: Category of the security event

- name: event.action
  type: keyword
  description: Action associated with the security event

- name: event.severity
  type: long
  description: Severity score associated with the event