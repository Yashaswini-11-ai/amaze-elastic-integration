---
description: Pipeline for normalizing AMaze audit log events into ECS.

processors:
  # Preserve original values in the amaze.* namespace.
  - set:
      field: amaze.actor
      copy_from: actor
      ignore_empty_value: true
  - set:
      field: amaze.action
      copy_from: action
      ignore_empty_value: true

  # ECS mapping.
  - rename:
      field: actor
      target_field: user.email
      ignore_missing: true
  - rename:
      field: action
      target_field: event.action
      ignore_missing: true
  - rename:
      field: id
      target_field: event.id
      ignore_missing: true
  - rename:
      field: timestamp
      target_field: "@timestamp"
      ignore_missing: true

  # ECS categorization.
  - set:
      field: event.kind
      value: event
  - set:
      field: event.category
      value: [iam]
  - set:
      field: event.type
      value: [info]
  - set:
      field: event.module
      value: amaze
  - set:
      field: event.dataset
      value: amaze.audit
  - set:
      field: event.created
      value: "{{{_ingest.timestamp}}}"
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"

on_failure:
  - set:
      field: error.message
      value: "{{ _ingest.on_failure_message }}"