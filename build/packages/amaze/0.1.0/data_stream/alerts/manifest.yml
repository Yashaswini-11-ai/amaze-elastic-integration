title: Alerts

type: logs

streams:
  - input: httpjson
    title: AMaze Alerts
    description: Collect AMaze alerts and ticket information
    vars:
      - name: base_url
        type: text
        title: AMaze Base URL
        required: true

      - name: bearer_token
        type: password
        title: Bearer Token
        secret: true
        required: true

      - name: verify
        type: bool
        title: Verify TLS Certificates
        default: true

      - name: interval
        type: text
        title: Collection Interval
        default: 5m

      - name: initial_interval
        type: text
        title: Initial Collection Interval
        default: 24h