- name: data_stream.dataset
  type: constant_keyword
  value: amaze.alerts

- name: data_stream.namespace
  type: constant_keyword
  value: default

- name: data_stream.type
  type: constant_keyword
  value: logs

- name: "@timestamp"
  type: date
  description: Timestamp when the AMaze event occurred

- name: event.id
  type: keyword
  description: Unique identifier for the AMaze security event

- name: event.action
  type: keyword
  description: Alert title or action generated by AMaze

- name: event.category
  type: keyword
  description: ECS event category for the AMaze alert

- name: event.type
  type: keyword
  description: ECS event type for the AMaze alert

- name: event.kind
  type: keyword
  description: ECS event kind for the AMaze alert

- name: event.created
  type: date
  description: Timestamp when the event was processed by the ingest pipeline

- name: event.severity
  type: long
  description: Threat score assigned by AMaze and mapped to ECS severity

- name: event.module
  type: keyword
  description: Module name for the AMaze integration

- name: event.dataset
  type: keyword
  description: Dataset name for the AMaze alerts data stream

- name: source.ip
  type: ip
  description: Source IP address associated with the detected activity

- name: destination.ip
  type: ip
  description: Destination IP address targeted during the activity

- name: network.protocol
  type: keyword
  description: Network protocol involved in the detected activity

- name: threat.technique.id
  type: keyword
  description: MITRE ATT&CK technique identifier associated with the alert

- name: amaze.ticket_status
  type: keyword
  description: Original ticket status returned by the AMaze API

- name: amaze.threat_score
  type: long
  description: Original threat score assigned by AMaze

- name: amaze.ttp
  type: keyword
  description: Original MITRE ATT&CK technique identifier returned by AMaze

- name: amaze.title
  type: keyword
  description: Original alert title returned by the AMaze API

- name: amaze.src_ip
  type: ip
  description: Original source IP address from the AMaze event

- name: amaze.dst_ip
  type: ip
  description: Original destination IP address from the AMaze event
