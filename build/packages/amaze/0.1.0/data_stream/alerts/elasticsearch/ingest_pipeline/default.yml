---
description: Pipeline for normalizing AMaze alert events into ECS.

processors:
  # Preserve original values in the amaze.* namespace for forensics.
  - set:
      field: amaze.src_ip
      copy_from: src_ip
      ignore_empty_value: true
  - set:
      field: amaze.dst_ip
      copy_from: dst_ip
      ignore_empty_value: true
  - set:
      field: amaze.threat_score
      copy_from: threat_score
      ignore_empty_value: true
  - set:
      field: amaze.ttp
      copy_from: ttp
      ignore_empty_value: true
  - set:
      field: amaze.title
      copy_from: title
      ignore_empty_value: true
  - set:
      field: amaze.ticket_status
      copy_from: status
      ignore_empty_value: true

  # ECS mapping.
  - rename:
      field: src_ip
      target_field: source.ip
      ignore_missing: true
  - rename:
      field: dst_ip
      target_field: destination.ip
      ignore_missing: true
  - rename:
      field: protocol
      target_field: network.protocol
      ignore_missing: true
  - rename:
      field: threat_score
      target_field: event.severity
      ignore_missing: true
  - rename:
      field: ttp
      target_field: threat.technique.id
      ignore_missing: true
  - rename:
      field: title
      target_field: event.action
      ignore_missing: true
  - rename:
      field: id
      target_field: event.id
      ignore_missing: true
  - rename:
      field: created_at
      target_field: "@timestamp"
      ignore_missing: true

  # ECS categorization.
  - set:
      field: event.kind
      value: alert
  - set:
      field: event.category
      value: [intrusion_detection]
  - set:
      field: event.type
      value: [info]
  - set:
      field: event.created
      value: "{{{_ingest.timestamp}}}"

on_failure:
  - set:
      field: error.message
      value: "{{ _ingest.on_failure_message }}"